<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: sans-serif; }
        .error-card { max-width: 500px; padding: 2rem; background: #fff; border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    </style>
</head>
<body>
    <div class="error-card">
        <i class="bi bi-x-octagon text-danger" style="font-size: 4rem;"></i>
        <h1 class="fw-bold mt-3 text-dark">400 Bad Request</h1>
        <p class="text-secondary mt-2 mb-4">The server could not understand the request due to invalid syntax, size limit exceeded, or corrupted parameters.</p>
        <a href="/" class="btn btn-primary">Go to Dashboard</a>
    </div>
</body>
</html>
